events {}

http {
 server {
    listen 8080;                 # Port où sscep se connectera
    server_name _;

    # Ne jamais bufferiser SCEP (il utilise du binaire)
    proxy_buffering off;

    # Ici : on rajoute le namespace !
    proxy_set_header X-Vault-Request "true";
    proxy_set_header X-Vault-Namespace "scep";

    location / {

        # Réécriture pour inclure le namespace dans l'URL
        rewrite ^/(.*)$ /v1/scep/$1 break;

        proxy_pass http://host.docker.internal:8200;   # L’URL de ton Vault local
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        #proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-For_Proto $scheme;
        proxy_redirect off;
    }
 }
}
